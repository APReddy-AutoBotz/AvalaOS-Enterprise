# The call replay (eval/discovery/call, eval/README.md "The call replay"; package C, C2). It replays made-up calls,
# two minutes at a time, through the BA panel's own rules (domain/meeting/) and the two live tasks the panel uses,
# `answerFromNotes` and `discoveryQuestions`. It uses AI, so it runs only from "Run workflow", or from a push to a
# `claude/` branch whose commit message holds the marker below; never on a schedule, never from any other push; and
# each run only on the owner's yes.
#
# The set: "dry" (the two made-up sets of notes, set M), "a" (those, the made-up transcripts D1 and D2 as notes, and
# the sample's three calls), "b" (the two transcripts of the process "Project time writing", read from the database at
# run time, only on the platform's key) or "all" (the counting run). The log holds numbers only: never a passage, a
# note, a question, a quote or a value; on set M it names which hand-written answers matched by their made-up keys.
#
# How to start it: "Run workflow" once this file is on the default branch; before that, a push to a `claude/` branch
# whose commit message holds `[call-replay dry]` (or `a`, `b`, `all`), as the Ask Avala measure is started. A push
# without that marker runs nothing.
#
# The AI use is counted against one workspace, "Test" unless named (owner, 26 November 2026). The run signs in as a
# trusted server with the project's server key, read with the access GitHub already holds for deploying the
# functions (SUPABASE_ACCESS_TOKEN); the key is masked at once and kept in that one step.
name: Call panel replay

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:
    inputs:
      set:
        description: Which calls (dry, a, b or all)
        default: dry
      workspace:
        description: Name of the workspace the AI use is counted against
        default: Test

concurrency:
  group: call-replay
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  replay:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[call-replay')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_REF: zpblzjedhqiuopfurjxh
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REPLAY_WORKSPACE_NAME: ${{ inputs.workspace || 'Test' }}
      REPLAY_SET_INPUT: ${{ inputs.set }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replay the calls and score them
        run: |
          set -euo pipefail
          REPLAY_SET="${REPLAY_SET_INPUT:-}"
          if [ -z "$REPLAY_SET" ]; then
            REPLAY_SET="$(printf '%s' "$COMMIT_MESSAGE" | grep -oE '\[call-replay (dry|a|b|all)\]' | head -1 | sed -E 's/\[call-replay (dry|a|b|all)\]/\1/' || true)"
            REPLAY_SET="${REPLAY_SET:-dry}"
          fi
          case "$REPLAY_SET" in dry|a|b|all) ;; *) echo "::error::The set is dry, a, b or all."; exit 1 ;; esac
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set, so the replay cannot sign in. Nothing was asked."
            exit 1
          fi
          key="$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true" \
            | jq -r '([.[] | select(.type == "secret" and .name == "default")] + [.[] | select(.name == "service_role")]) | .[0].api_key // empty' 2>/dev/null)" || key=""
          if [ -z "$key" ]; then
            echo "::error::The project's server key could not be read, so the replay cannot sign in. Nothing was asked."
            exit 1
          fi
          echo "::add-mask::$key"
          echo "AI use is counted against the workspace \"$REPLAY_WORKSPACE_NAME\"; set \"$REPLAY_SET\"."
          REPLAY_URL="https://$PROJECT_REF.supabase.co" REPLAY_KEY="$key" node eval/discovery/call/run.ts --live --set "$REPLAY_SET"
