name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret hygiene scan
        run: npm run test:secret-hygiene

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck edge functions
        run: npm run typecheck:edge

      - name: Tests for new code and eval integrity
        run: npm run test:new

      - name: Production build
        run: npm run build

      # The browser tests' stand-in for AI tasks is built only into their own build (package 16).
      - name: The test stand-in is not in the released build
        run: node scripts/check-no-stand-ins.mjs dist

  e2e:
    name: Browser tests (process journey)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A pull request that changes only the notes and plans (docs/ and Markdown files) needs no browser
      # test: the job still runs under the same name and passes, after this step alone (owner, 18 November
      # 2026, to save Actions minutes). Pushes to main always run everything.
      - name: Decide whether the browser tests are needed
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
            if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '^docs/|\.md$'; then
              echo "Only notes and plans changed; the browser tests are not needed."
              echo "needed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.scope.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.needed == 'true'
        run: npm ci

      - name: Install Chromium (the runner image already has its system libraries)
        if: steps.scope.outputs.needed == 'true'
        run: npx playwright install chromium

      - name: Browser tests
        if: steps.scope.outputs.needed == 'true'
        run: npm run test:e2e

      # The agent's workspace cannot download artifacts, so on its branches the screenshots are
      # also printed to the log (base64 JPEG) for visual review.
      - name: Print screenshots for review
        if: always() && steps.scope.outputs.needed == 'true' && startsWith(github.head_ref, 'claude/')
        run: |
          for f in test-results/screens/*.jpg; do
            [ -f "$f" ] || continue
            echo "BEGIN_SCREEN $(basename "$f")"
            base64 -w0 "$f"; echo
            echo "END_SCREEN"
          done
          # The demo's starting state from the tour test (gzip, base64), for public/demo-data/sample.json.
          if [ -f test-results/demo/sample.json ]; then
            echo "BEGIN_DEMO_DATA sample.json.gz"
            gzip -9 -c test-results/demo/sample.json | base64 -w0; echo
            echo "END_DEMO_DATA"
          fi

      - name: Keep screenshots and the report
        if: always() && steps.scope.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
