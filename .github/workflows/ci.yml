name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret hygiene scan
        run: npm run test:secret-hygiene

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck edge functions
        run: npm run typecheck:edge

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build
