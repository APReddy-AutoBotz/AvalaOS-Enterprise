name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret hygiene scan
        run: npm run test:secret-hygiene

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck edge functions
        run: npm run typecheck:edge

      # The inherited unit tests cover inherited code. They run only when that code,
      # its runners or the dependency set changes, or when the workflow is started by hand.
      - name: Tests for new code and eval integrity
        run: npm run test:new

      - name: Decide whether inherited unit tests are needed
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then echo "inherited=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT_NAME" != "pull_request" ]; then echo "inherited=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if git diff --name-only FETCH_HEAD HEAD | grep -qE '^(services|components|data|constants|scripts|tests|supabase/functions)/|^(App|index|types|constants)\.tsx?$|^package(-lock)?\.json$|^tsconfig'; then
            echo "inherited=true" >> "$GITHUB_OUTPUT"
          else
            echo "inherited=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Inherited unit tests
        if: steps.scope.outputs.inherited == 'true'
        run: npm run test:unit

      - name: Production build
        run: npm run build

  e2e:
    name: Browser tests (process journey)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Keep screenshots and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
