# Keeps package-lock.json in step with package.json on agent branches, whose workspace cannot reach
# the npm registry. It runs only when package.json changes on a claude/ branch and commits the
# regenerated lockfile to that branch. CI then runs `npm ci` against it on the next push.
name: Update lockfile

on:
  push:
    branches: ['claude/**']
    paths: ['package.json']

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate the lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit if it changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update package-lock.json for package.json changes"
          git push
