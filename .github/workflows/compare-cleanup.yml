# Temporary (package 15 of docs/next-plan.md): proves that removing the code the live product does not use
# changes nothing that runs. Builds the site from the state before the cleanup (the branch
# claude/before-cleanup-2026-11, or the tag before-cleanup-2026-11 once it exists) and from this pull
# request, and compares them file for file; compares every file each server function bundles; reads the
# stylesheet rule by rule. Removed with the notes once the package is merged.
name: Compare with the state before the cleanup

on:
  pull_request:
    branches:
      - next

permissions:
  contents: read

jobs:
  compare:
    name: Compare with the state before the cleanup (temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check out the state before the cleanup
        run: |
          if git rev-parse -q --verify "refs/tags/before-cleanup-2026-11" >/dev/null; then ref=before-cleanup-2026-11; else ref=origin/claude/before-cleanup-2026-11; fi
          echo "Before: $ref ($(git rev-parse "$ref^{commit}"))"
          git worktree add /tmp/before "$ref^{commit}"

      - name: Build after
        run: |
          npm ci
          npm run build
          mv dist /tmp/dist-after

      - name: Build before
        working-directory: /tmp/before
        run: |
          npm ci
          npm run build

      - name: Server functions, file for file
        run: |
          mkdir -p /tmp/compare
          status=0
          for fn in journey-ai journey-extract journey-inquiry journey-invite journey-notify; do
            e="supabase/functions/$fn/index.ts"
            AVALA_ROOT=/tmp/before node scripts/in-use.mjs --from "$e" > "/tmp/compare/$fn-before.txt"
            node scripts/in-use.mjs --from "$e" > "/tmp/compare/$fn-after.txt"
            if cmp -s "/tmp/compare/$fn-before.txt" "/tmp/compare/$fn-after.txt"; then
              echo "- $fn: $(wc -l < "/tmp/compare/$fn-after.txt") files, every one identical before and after" | tee -a /tmp/compare/functions.md
            else
              echo "- FAIL: $fn bundles different files" | tee -a /tmp/compare/functions.md
              diff "/tmp/compare/$fn-before.txt" "/tmp/compare/$fn-after.txt" || true
              status=1
            fi
          done
          cmp supabase/functions/deno.d.ts /tmp/before/supabase/functions/deno.d.ts && echo "- deno.d.ts identical" | tee -a /tmp/compare/functions.md
          exit $status

      - name: The built site and the stylesheet
        run: node scripts/compare-builds.mjs /tmp/before/dist /tmp/dist-after /tmp/before . /tmp/compare

      - name: Summary
        if: always()
        run: |
          { echo "## Server functions"; cat /tmp/compare/functions.md 2>/dev/null; echo; echo "## The built site and the stylesheet"; cat /tmp/compare/report.md 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"
          echo "BEGIN_COMPARE"; for f in /tmp/compare/*.txt /tmp/compare/*.md; do echo "=== $(basename "$f")"; cat "$f"; done; echo "END_COMPARE"

      - name: Keep the comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compare-before-cleanup
          path: /tmp/compare
