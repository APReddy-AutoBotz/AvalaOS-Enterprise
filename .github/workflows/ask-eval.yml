# The Ask Avala measure (eval/ask, eval/README.md): asks the question set on the sample case through
# the live AI gateway and prints the scorecard. It uses AI, so it never runs on its own: only from
# "Run workflow", or on a claude/ branch when the commit message contains [ask-eval] (once),
# [ask-eval 2] (twice, up to 5), [ask-eval only:platform,score] (only those kinds or question ids) or
# [ask-eval check] (sign-in and workspace only, no AI is called) or [ask-eval record] (the demo's
# recorded answers: each scope's starter questions once, printed for public/demo-data/ask-answers.json).
#
# The AI use is counted against one workspace, named below; with its own AI provider connected, the
# measure runs on that provider. The run signs in as a trusted server with the project's server key,
# read with the access GitHub already holds for deploying the functions (SUPABASE_ACCESS_TOKEN). The key
# is masked at once, kept in that one step and never printed. The questions and answers in the log are
# about the made-up sample company only. The project ref is public (it is in the API URL).
name: Ask Avala measure

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:
    inputs:
      workspace:
        description: Name of the workspace the AI use is counted against
        default: Avala check
      runs:
        description: How many times to ask the whole set (1 to 5)
        default: '1'
      only:
        description: Only these kinds or question ids, separated by commas (empty for the whole set)
        default: ''

concurrency:
  group: ask-eval
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  measure:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ask-eval')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT_REF: zpblzjedhqiuopfurjxh
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ASK_EVAL_WORKSPACE_NAME: ${{ inputs.workspace || 'Avala check' }}
      RUNS: ${{ inputs.runs }}
      ONLY: ${{ inputs.only }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ask the question set and score the answers
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set, so the measure cannot sign in. Nothing was asked."
            exit 1
          fi
          mode="--live"
          runs="${RUNS:-}"
          if [[ "$COMMIT_MESSAGE" == *"[ask-eval check]"* ]]; then mode="--check"; fi
          if [[ "$COMMIT_MESSAGE" == *"[ask-eval record]"* ]]; then mode="--record"; fi
          if [ -z "$runs" ] && [[ "$COMMIT_MESSAGE" =~ \[ask-eval\ ([1-5])\] ]]; then runs="${BASH_REMATCH[1]}"; fi
          runs="${runs:-1}"
          case "$runs" in [1-5]) ;; *) echo "::error::Runs must be 1 to 5."; exit 1 ;; esac
          only="${ONLY:-}"
          if [ -z "$only" ] && [[ "$COMMIT_MESSAGE" =~ \[ask-eval\ only:([A-Za-z0-9,_-]+)\] ]]; then only="${BASH_REMATCH[1]}"; fi
          if [ -n "$only" ] && ! [[ "$only" =~ ^[A-Za-z0-9,_-]+$ ]]; then echo "::error::Only takes kinds or question ids separated by commas."; exit 1; fi
          args=("$mode" --runs "$runs")
          if [ -n "$only" ]; then args+=(--only "$only"); fi

          # The server key the functions themselves hold: the project's secret key named "default",
          # else the older service key. Nothing of the reply is printed.
          key="$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true" \
            | jq -r '([.[] | select(.type == "secret" and .name == "default")] + [.[] | select(.name == "service_role")]) | .[0].api_key // empty' 2>/dev/null)" || key=""
          if [ -z "$key" ]; then
            echo "::error::The project's server key could not be read, so the measure cannot sign in. Nothing was asked."
            exit 1
          fi
          echo "::add-mask::$key"

          ASK_EVAL_URL="https://$PROJECT_REF.supabase.co" ASK_EVAL_KEY="$key" node eval/ask/run.ts "${args[@]}"
