# Temporary (package 13 A): applies the dependency fixes that stay within the versions package.json allows
# (`npm audit fix` without --force, lockfile only), commits the lockfile if it changed, and prints the
# advisories before and after. Removed in the next commit.
name: Dependency fixes within the allowed versions

on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/audit-fix.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Before
        run: |
          npm audit --json > /tmp/all.json || true; npm audit --omit=dev --json > /tmp/shipped.json || true
          node scripts/audit-summary.mjs /tmp/all.json /tmp/shipped.json || true
      - name: Fix within the allowed versions
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: After
        run: |
          npm audit --json > /tmp/all.json || true; npm audit --omit=dev --json > /tmp/shipped.json || true
          node scripts/audit-summary.mjs /tmp/all.json /tmp/shipped.json || true
          git diff --stat -- package-lock.json package.json
      - name: Commit if it changed
        run: |
          if git diff --quiet -- package-lock.json package.json; then echo "Nothing to fix within the allowed versions."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "Dependency fixes within the allowed versions (npm audit fix, lockfile only)"
          git push
