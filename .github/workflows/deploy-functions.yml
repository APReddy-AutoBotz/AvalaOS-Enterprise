# Deploys the journey edge functions from the repository with the Supabase CLI.
# Runs on main, and on claude/ branches when the commit message contains [deploy] (to try a change
# against the live project before merging). Needs the SUPABASE_ACCESS_TOKEN repository secret;
# without it the job says so and does nothing. The project ref is public (it is in the API URL).
# Run by hand ("Run workflow"), it can deploy one function only, so a change to one function goes live
# without the others.
name: Deploy edge functions

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'supabase/functions/journey-*/**'
      - 'domain/**'
      - 'eval/scorer.ts'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:
    inputs:
      function:
        description: Which function to deploy
        type: choice
        options: [all, journey-ai, journey-extract, journey-invite, journey-notify]
        default: all

concurrency:
  group: deploy-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zpblzjedhqiuopfurjxh
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy journey functions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set, so nothing was deployed."
            exit 0
          fi
          only="${{ github.event.inputs.function }}"
          fns="journey-ai journey-extract journey-invite journey-notify"
          if [ -n "$only" ] && [ "$only" != "all" ]; then fns="$only"; fi
          echo "Deploying: $fns (from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7})"
          for fn in $fns; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes
          done
