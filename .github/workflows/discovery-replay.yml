# The discovery replay (eval/discovery, eval/README.md "The discovery replay"; package B, plan section 9).
# It uses AI, so it runs only from "Run workflow", never on its own and never from a push. It needs journey-ai
# to carry the task `discoveryQuestions` (an early deploy or the release that carries it); until then every
# call is refused as an unknown task and the run stops at the first.
#
# The set: "dry" (the two made-up transcripts in eval/discovery), "a" (those and the sample's three calls),
# "b" (the two transcripts of the process "Project time writing", read from the database at run time, owner,
# 23 November 2026) or "all" (the counting run). The log holds numbers only: never a passage, a question, a
# quote or a source's title. Set B's text is held in memory for the run and never stored, logged or printed.
#
# The AI use is counted against one workspace, "Avala check" unless named. The run signs in as a trusted
# server with the project's server key, read with the access GitHub already holds for deploying the
# functions (SUPABASE_ACCESS_TOKEN); the key is masked at once and kept in that one step.
name: Discovery replay

on:
  workflow_dispatch:
    inputs:
      set:
        description: Which transcripts (dry, a, b or all)
        default: dry
      workspace:
        description: Name of the workspace the AI use is counted against
        default: Avala check

concurrency:
  group: discovery-replay
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT_REF: zpblzjedhqiuopfurjxh
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REPLAY_WORKSPACE_NAME: ${{ inputs.workspace || 'Avala check' }}
      REPLAY_SET: ${{ inputs.set || 'dry' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replay the transcripts and score them
        run: |
          set -euo pipefail
          case "$REPLAY_SET" in dry|a|b|all) ;; *) echo "::error::The set is dry, a, b or all."; exit 1 ;; esac
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set, so the replay cannot sign in. Nothing was asked."
            exit 1
          fi
          key="$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true" \
            | jq -r '([.[] | select(.type == "secret" and .name == "default")] + [.[] | select(.name == "service_role")]) | .[0].api_key // empty' 2>/dev/null)" || key=""
          if [ -z "$key" ]; then
            echo "::error::The project's server key could not be read, so the replay cannot sign in. Nothing was asked."
            exit 1
          fi
          echo "::add-mask::$key"
          echo "AI use is counted against the workspace \"$REPLAY_WORKSPACE_NAME\"; set \"$REPLAY_SET\"."
          REPLAY_URL="https://$PROJECT_REF.supabase.co" REPLAY_KEY="$key" node eval/discovery/run.ts --live --set "$REPLAY_SET"
