# The extraction check (eval/README.md, "Live extraction runs"): runs one case of the eval corpus
# through the live journey-extract function and prints the scorecard. It uses AI, so it runs only from
# "Run workflow". It makes the run with the project's server key, read with the access GitHub already
# holds for deploying the functions (SUPABASE_ACCESS_TOKEN); the key is masked at once, kept in that one
# step and never printed. The case's files go with the start request from this checkout, and the function
# takes them only when each matches the SHA-256 recorded in eval/corpus/cases.ts (package 13 B, item 9).
# The sources are about the made-up sample company only. The project ref is public (it is in the API URL).
name: Extraction check

on:
  workflow_dispatch:
    inputs:
      case:
        description: The case to run
        type: choice
        options: [ap-invoice, ap-invoice-image, ap-invoice-no-flow]
        default: ap-invoice
      workspace_id:
        description: Run on this workspace's own AI connection (empty for the platform key)
        default: ''
      option:
        description: "none; start-at-kinds (the facts merge one answer per kind); record-cutoff (one tiny call cut off on purpose, its reply printed)"
        type: choice
        options: [none, start-at-kinds, record-cutoff]
        default: none

concurrency:
  group: extraction-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_REF: zpblzjedhqiuopfurjxh
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CASE: ${{ inputs.case }}
      WORKSPACE_ID: ${{ inputs.workspace_id }}
      OPTION: ${{ inputs.option }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the case and print its scorecard
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set, so the check cannot be made. Nothing was run."
            exit 1
          fi
          if [ -n "$WORKSPACE_ID" ] && ! [[ "$WORKSPACE_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then echo "::error::The workspace id is not a UUID."; exit 1; fi
          key="$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true" \
            | jq -r '([.[] | select(.type == "secret" and .name == "default")] + [.[] | select(.name == "service_role")]) | .[0].api_key // empty' 2>/dev/null)" || key=""
          if [ -z "$key" ]; then
            echo "::error::The project's server key could not be read, so the check cannot be made. Nothing was run."
            exit 1
          fi
          echo "::add-mask::$key"
          opt=""; if [ "$OPTION" != "none" ]; then opt="--$OPTION"; fi
          EXTRACT_URL="https://$PROJECT_REF.supabase.co" EXTRACT_KEY="$key" node eval/corpus/check.ts "$CASE" "$WORKSPACE_ID" $opt
