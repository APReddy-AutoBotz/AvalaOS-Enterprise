# Local-only Supabase configuration for repository validation.
# This file is intentionally generic and contains no secret material.

project_id = "avalaos-enterprise"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = true

[auth]
enabled = true
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6
password_requirements = ""

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
port = 54327
backend = "postgres"

[functions.studio-private-artifact-reconcile]
verify_jwt = false

# This verifier authenticates GitHub Actions OIDC tokens itself. Supabase gateway
# JWT verification must therefore be disabled for this one function only; the
# handler verifies the GitHub RS256 signature, issuer, audience, repository,
# workflow path, immutable ref, exact SHA, run ID and run attempt before RPC use.
[functions.hosted-pilot-github-verifier]
verify_jwt = false

# Both endpoints validate the bearer with Supabase Auth and resolve fresh tenant
# authority in their handler; gateway JWT parsing is not their authorization gate.
[functions.legacy-delivery-command]
verify_jwt = false

[functions.legacy-delivery-query]
verify_jwt = false

# The journey functions authenticate callers themselves (user session or run token).
[functions.journey-ai]
verify_jwt = false

[functions.journey-invite]
verify_jwt = false

[functions.journey-extract]
verify_jwt = false
